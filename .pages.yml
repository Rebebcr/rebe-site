# Panel de edición de rebebcr.com (Pages CMS · app.pagescms.org)
# Cada vez que se guarda un cambio, Netlify publica el sitio en 1–2 minutos.

media:
  input: assets
  output: /assets
  rename: safe

content:
  - name: inicio
    label: Página de inicio
    description: La página principal (rebebcr.com). Arrastre las secciones para cambiar el orden.
    type: file
    path: content/inicio.json
    format: json
    fields:
      - name: titulo
        label: Título en Google y en la pestaña del navegador
        type: string
        required: true
      - name: descripcion
        label: Descripción en Google
        description: Una o dos frases que resumen la página.
        type: text
      - name: imagen_compartir
        label: Imagen al compartir en redes (opcional)
        description: La foto que aparece cuando alguien comparte el enlace en WhatsApp o redes. Si queda vacía se usa la de Ajustes.
        type: image
      - name: secciones
        component: secciones

  - name: paginas
    label: Otras páginas
    description: "Páginas nuevas (talleres, programas, eventos…). La dirección se crea con el título: «Talleres 2027» → rebebcr.com/talleres-2027/"
    type: collection
    path: content/paginas
    format: json
    filename: "{titulo}.json"
    view:
      primary: titulo
      fields: [titulo]
    fields:
      - name: titulo
        label: Título de la página
        description: También define la dirección de la página al crearla. Cambiarlo después no cambia la dirección.
        type: string
        required: true
      - name: descripcion
        label: Descripción en Google
        type: text
      - name: imagen_compartir
        label: Imagen al compartir en redes (opcional)
        type: image
      - name: secciones
        component: secciones

  - name: ajustes
    label: Ajustes del sitio (menú, pie de página, redes)
    type: file
    path: content/ajustes.json
    format: json
    fields:
      - name: nombre_sitio
        label: Nombre del sitio
        type: string
        required: true
      - name: dominio
        label: Dominio
        type: string
        hidden: true
      - name: descripcion
        label: Descripción general en Google
        type: text
      - name: imagen_compartir
        label: Imagen al compartir en redes
        type: image
      - name: logo
        label: Logo del menú
        type: image
      - name: logo_pie
        label: Logo del pie de página
        type: image
      - name: icono
        label: Ícono de la pestaña del navegador
        type: image
      - name: menu
        label: Enlaces del menú
        description: Si lo deja vacío, el menú solo muestra el botón dorado. Con enlaces, en celulares aparece el menú de tres rayas.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{texto} → {enlace}"
        fields:
          - name: texto
            label: Texto
            type: string
            required: true
          - name: enlace
            component: enlace
          - name: nueva_pestana
            label: Abrir en otra pestaña
            type: boolean
      - name: boton_menu
        label: Botón dorado del menú
        component: boton
      - name: redes
        label: Redes sociales (pie de página)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{red}"
        fields:
          - name: red
            label: Red
            type: select
            options:
              values:
                - { value: facebook, label: Facebook }
                - { value: instagram, label: Instagram }
                - { value: linkedin, label: LinkedIn }
                - { value: youtube, label: YouTube }
                - { value: tiktok, label: TikTok }
                - { value: x, label: X (Twitter) }
                - { value: whatsapp, label: WhatsApp }
          - name: enlace
            label: Enlace a su perfil
            type: string
      - name: pie_texto
        label: Texto del pie de página
        description: "{año} se reemplaza por el año actual."
        type: string
      - name: codigo_head
        label: Códigos de seguimiento (en el encabezado)
        description: "Para Meta Pixel, Google Analytics, etc. Pegue aquí el código que le da la herramienta cuando dice «pegar en el <head>». Si no sabe qué es, déjelo vacío."
        type: code
        options:
          format: html
      - name: codigo_body
        label: Códigos adicionales (al final de la página)
        description: Para chats o códigos que piden pegarse antes de </body>. Si no sabe qué es, déjelo vacío.
        type: code
        options:
          format: html

components:
  enlace:
    label: Enlace
    description: "Otra página del sitio: /talleres/ · Una sección de inicio: #contacto · Otro sitio: https://…"
    type: string

  boton:
    label: Botón
    type: object
    fields:
      - name: texto
        label: Texto del botón
        type: string
      - name: enlace
        component: enlace
      - name: estilo
        label: Estilo
        type: select
        default: dorado
        options:
          values:
            - { value: dorado, label: Dorado (principal) }
            - { value: contorno, label: Solo borde (secundario) }
      - name: nueva_pestana
        label: Abrir en otra pestaña
        type: boolean

  botones:
    label: Botones
    component: boton
    list:
      collapsible:
        collapsed: true
        summary: "{texto}"

  ancla:
    label: Nombre para enlazar esta sección (opcional)
    description: "Una palabra sin espacios, por ejemplo: contacto. Luego un botón o el menú puede llevar aquí con #contacto."
    type: string

  visible:
    label: Mostrar esta sección
    description: Desmárquelo para ocultar la sección sin borrarla.
    type: boolean
    default: true

  fondo:
    label: Color de fondo
    type: select
    options:
      values:
        - { value: normal, label: Azul oscuro }
        - { value: alterno, label: Azul un poco más claro }
        - { value: negro, label: Casi negro }

  alineacion:
    label: Alineación
    type: select
    options:
      values:
        - { value: izquierda, label: Izquierda }
        - { value: centro, label: Centrado }

  enfoque:
    label: Parte de la foto que se ve (si se recorta)
    type: select
    options:
      values:
        - { value: "center 20%", label: Arriba }
        - { value: "center 30%", label: Un poco arriba }
        - { value: center, label: Centro }
        - { value: "center 70%", label: Un poco abajo }
        - { value: "center 85%", label: Abajo }
        - { value: "left center", label: Izquierda }
        - { value: "right center", label: Derecha }

  titulo:
    label: Título
    description: "Escriba *entre asteriscos* para poner palabras en cursiva dorada."
    type: text

  rico:
    label: Texto
    type: rich-text
    options:
      format: html

  secciones:
    label: Secciones
    description: Agregue, quite o arrastre secciones para cambiar el orden.
    type: block
    list:
      collapsible:
        collapsed: true
        summary: "{index}. {_block} · {titulo}"
    blocks:
      # ---------- Bloques del diseño original ----------
      - name: portada
        label: Portada grande (con foto)
        fields:
          - { name: etiqueta, label: Texto pequeño dorado (arriba del título), type: string }
          - { name: titulo, component: titulo }
          - { name: subtitulo, label: Subtítulo, type: text }
          - { name: frase, label: Frase en cursiva, type: text }
          - { name: botones, component: botones }
          - { name: imagen, label: Foto, type: image }
          - { name: imagen_texto, label: Descripción de la foto (para accesibilidad), type: string }
          - { name: enfoque, component: enfoque }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: encabezado
        label: Encabezado de página (para páginas nuevas)
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - { name: subtitulo, label: Subtítulo, type: text }
          - { name: imagen, label: Imagen de fondo (opcional), type: image }
          - { name: enfoque, component: enfoque }
          - { name: alineacion, component: alineacion }
          - { name: botones, component: botones }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: manifiesto
        label: Texto largo con retratos al lado
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: cita, label: Cita inicial, type: text }
          - { name: cita_autor, label: Autor de la cita, type: string }
          - { name: titulo, component: titulo }
          - { name: texto, label: Texto, component: rico }
          - { name: destacado_titulo, label: Título del recuadro destacado, type: string }
          - { name: destacado, label: Recuadro destacado (lista), component: rico }
          - { name: texto_final, label: Texto después del recuadro, component: rico }
          - { name: cierre, label: Frase de cierre en dorado, type: text }
          - name: imagenes
            label: Retratos (columna derecha)
            type: image
            options:
              multiple: true
          - { name: imagen_texto, label: Descripción de los retratos, type: string }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: imagen_lateral
        label: Texto con foto de fondo a un lado
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - { name: texto, label: Texto, component: rico }
          - { name: cita, label: Cita (opcional), type: text }
          - { name: botones, component: botones }
          - { name: imagen, label: Foto, type: image }
          - { name: enfoque, component: enfoque }
          - name: lado
            label: Lado de la foto
            type: select
            options:
              values:
                - { value: izquierda, label: Izquierda }
                - { value: derecha, label: Derecha }
          - { name: fondo, component: fondo }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: servicios
        label: Servicios (tarjetas)
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - { name: intro, label: Introducción, type: text }
          - { name: numerar, label: "Numerar las tarjetas (01, 02…)", type: boolean, default: true }
          - name: tarjetas
            label: Tarjetas
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{titulo}"
            fields:
              - { name: titulo, label: Título, type: string, required: true }
              - { name: texto, label: Texto, type: text }
              - { name: enlace, label: Enlace (opcional — la tarjeta lleva a otra página), component: enlace }
              - { name: texto_enlace, label: Texto del enlace (ej. Conocer más), type: string }
          - { name: frase_hilo, label: Frase debajo de las tarjetas, type: text }
          - { name: filosofia_titulo, label: Título del bloque de citas, type: string }
          - name: filosofia_citas
            label: Citas
            type: text
            list: true
          - { name: nota, label: Nota al final, component: rico }
          - { name: imagen, label: Foto al lado (opcional), type: image }
          - { name: imagen_texto, label: Descripción de la foto, type: string }
          - { name: fondo, component: fondo }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: frase
        label: Frase destacada (banda)
        fields:
          - { name: frase, label: Frase, type: text, required: true }
          - { name: autor, label: Autor (opcional), type: string }
          - { name: imagen, label: Imagen de fondo (opcional), type: image }
          - { name: enfoque, component: enfoque }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: metodo
        label: Método por pasos (tipo M.A.R.I.P.O.S.A)
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - { name: intro, label: Introducción, type: text }
          - name: pasos
            label: Pasos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{letra} · {titulo}"
            fields:
              - { name: letra, label: Letra o número, type: string }
              - { name: titulo, label: Título, type: string }
              - { name: texto, label: Texto, type: text }
          - { name: botones, component: botones }
          - { name: fondo, component: fondo }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: trayectoria
        label: Trayectoria (cifras y credenciales)
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - name: cifras
            label: Cifras
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{numero} {descripcion}"
            fields:
              - { name: numero, label: Número (ej. 20+), type: string }
              - { name: descripcion, label: Descripción, type: text }
          - { name: linea_referencias, label: Línea debajo de las cifras, type: string }
          - { name: cita, label: Cita, type: text }
          - { name: imagen, label: Imagen (se muestra completa), type: image }
          - { name: imagen_texto, label: Descripción de la imagen, type: string }
          - { name: credenciales_titulo, label: Título de la lista, type: string }
          - { name: credenciales, label: Credenciales (lista), component: rico }
          - { name: acreditacion_org, label: Recuadro final — organización, type: string }
          - { name: acreditacion_titulos, label: Recuadro final — títulos, type: string }
          - { name: fondo, component: fondo }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: galeria
        label: Galería de fotos
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - name: fotos
            label: Fotos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{descripcion}"
            fields:
              - { name: imagen, label: Foto, type: image, required: true }
              - { name: descripcion, label: Descripción, type: string }
              - { name: enfoque, component: enfoque }
          - { name: fondo, component: fondo }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: reconocimientos
        label: Reconocimientos / medios
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - name: items
            label: Reconocimientos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{tipo} · {nombre}"
            fields:
              - { name: tipo, label: Tipo (ej. Podcast), type: string }
              - { name: nombre, label: Nombre, type: string }
              - { name: enlace, label: Enlace (opcional), component: enlace }
              - { name: logo, label: Logo (opcional), type: image }
          - { name: fondo, component: fondo }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: texto_con_imagen
        label: Texto con imagen (libro, programa, evento…)
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - { name: texto, label: Texto, component: rico }
          - { name: cita, label: Cita (opcional), type: text }
          - { name: botones, component: botones }
          - { name: imagen, label: Imagen, type: image }
          - { name: imagen_texto, label: Descripción de la imagen, type: string }
          - name: estilo_imagen
            label: Tipo de imagen
            type: select
            options:
              values:
                - { value: portada, label: Portada de libro (más pequeña) }
                - { value: foto, label: Foto (ancho completo) }
          - name: lado
            label: Lado de la imagen
            type: select
            options:
              values:
                - { value: derecha, label: Derecha }
                - { value: izquierda, label: Izquierda }
          - { name: fondo, component: fondo }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: testimonios
        label: Testimonios (videos y/o escritos)
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - { name: intro, label: Introducción, type: text }
          - { name: portada, label: Imagen de portada de los videos, type: image }
          - name: videos
            label: Videos
            description: Suba el video (MP4, idealmente menos de 20 MB) o pegue un enlace de YouTube/Vimeo.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{descripcion}"
            fields:
              - name: video
                label: Archivo de video (MP4)
                type: file
                options:
                  extensions: [mp4, webm, mov]
              - { name: enlace, label: O enlace de YouTube / Vimeo, type: string }
              - { name: descripcion, label: Texto debajo del video, type: string }
              - { name: portada, label: Portada de este video (opcional), type: image }
          - name: escritos
            label: Testimonios escritos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{nombre}"
            fields:
              - { name: texto, label: Testimonio, type: text, required: true }
              - { name: nombre, label: Nombre, type: string }
              - { name: cargo, label: Cargo y empresa, type: string }
          - { name: fondo, component: fondo }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: contacto
        label: Contacto (WhatsApp y correo)
        fields:
          - { name: imagen, label: Foto redonda, type: image }
          - { name: enfoque, component: enfoque }
          - { name: cita, label: Cita, type: text }
          - { name: titulo, component: titulo }
          - { name: intro, label: Introducción, type: text }
          - { name: whatsapp, label: Número de WhatsApp (con código de país), type: string }
          - { name: whatsapp_texto, label: Texto del botón de WhatsApp, type: string }
          - { name: whatsapp_mensaje, label: Mensaje escrito por defecto (opcional), type: string }
          - { name: correo, label: Correo, type: string }
          - { name: correo_texto, label: Texto del botón de correo, type: string }
          - { name: detalle, label: Línea de datos debajo de los botones, type: string }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      # ---------- Bloques nuevos ----------
      - name: texto
        label: Texto libre
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - { name: texto, label: Texto, component: rico }
          - { name: botones, component: botones }
          - { name: alineacion, component: alineacion }
          - name: ancho
            label: Ancho
            type: select
            options:
              values:
                - { value: normal, label: Normal (más fácil de leer) }
                - { value: amplio, label: Amplio }
          - { name: fondo, component: fondo }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: botones
        label: Botones (llevar a otras páginas)
        fields:
          - { name: titulo, component: titulo }
          - { name: intro, label: Texto (opcional), type: text }
          - { name: botones, component: botones }
          - { name: alineacion, component: alineacion }
          - { name: fondo, component: fondo }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: video
        label: Video (YouTube, Vimeo o archivo)
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - { name: intro, label: Texto (opcional), type: text }
          - { name: enlace, label: Enlace de YouTube o Vimeo, type: string }
          - name: archivo
            label: O archivo de video (MP4)
            type: file
            options:
              extensions: [mp4, webm, mov]
          - { name: portada, label: Portada del video (solo para archivo), type: image }
          - name: formato
            label: Formato
            type: select
            options:
              values:
                - { value: horizontal, label: Horizontal }
                - { value: vertical, label: Vertical (celular) }
          - { name: alineacion, component: alineacion }
          - { name: fondo, component: fondo }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: formulario
        label: Formulario
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - { name: intro, label: Introducción, type: text }
          - name: nombre_formulario
            label: Nombre interno del formulario
            description: Sirve para distinguir las respuestas en el correo (ej. inscripcion-taller). Use uno diferente en cada formulario.
            type: string
            required: true
          - name: campos
            label: Campos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{etiqueta} ({tipo})"
            fields:
              - { name: etiqueta, label: Pregunta / nombre del campo, type: string, required: true }
              - name: tipo
                label: Tipo de respuesta
                type: select
                default: texto
                options:
                  values:
                    - { value: texto, label: Texto corto }
                    - { value: correo, label: Correo electrónico }
                    - { value: telefono, label: Teléfono }
                    - { value: mensaje, label: Texto largo (mensaje) }
                    - { value: opciones, label: Lista de opciones }
                    - { value: fecha, label: Fecha }
                    - { value: numero, label: Número }
                    - { value: casilla, label: Casilla para marcar (ej. acepto…) }
              - { name: obligatorio, label: Obligatorio, type: boolean }
              - { name: opciones, label: Opciones (una por línea — solo para «Lista de opciones»), type: text }
              - { name: ayuda, label: Texto de ayuda dentro del campo (opcional), type: string }
          - { name: boton_texto, label: Texto del botón, type: string }
          - { name: mensaje_exito, label: Mensaje al enviar, type: text }
          - { name: alineacion, component: alineacion }
          - { name: fondo, component: fondo }
          - { name: ancla, component: ancla }
          - { name: visible, component: visible }

      - name: codigo_externo
        label: Código externo (Calendly, Google Forms, mapas…)
        fields:
          - { name: etiqueta, label: Texto pequeño dorado, type: string }
          - { name: titulo, component: titulo }
          - { name: intro, label: Texto (opcional), type: text }
          - name: codigo
            label: Código para insertar
            description: Pegue el código «embed» / «insertar» que le da la herramienta (Calendly, Google Maps, Google Forms, Typeform…).
            type: code
            options:
              format: html
          - name: ancho
            label: Ancho
            type: select
            options:
              values:
                - { value: normal, label: Normal }
